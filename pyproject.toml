[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hacksome"
version = "0.1.0"
description = "A local Codex orchestrator for evidence-backed hackathon ideas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
hacksome = "hacksome.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hacksome = [
  "stages/ideation/useful/prompts/*.md",
  "stages/ideation/useful/schemas/*.json",
  "stages/ideation/creative/prompts/*.md",
  "stages/ideation/creative/schemas/*.json",
  "stages/ideation/creative/review_ui/*",
  "stages/pitch/prompts/*.md",
  "stages/pitch/schemas/*.json",
  "stages/build/approval_ui/*",
  "stages/build/assets/agents/*.yaml",
  "stages/build/assets/agents/assets/*.md",
  "stages/build/assets/agents/assets/skills/*/SKILL.md",
  "stages/build/assets/agents/assets/skills/*/agents/*.yaml",
  "stages/build/assets/agents/ephemeral/*.yaml",
  "stages/build/assets/agents/mcp/*.json",
  "stages/build/assets/scripts/*.sh",
]
